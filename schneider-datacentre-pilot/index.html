<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
SEXTANT MASTER CONSOLE - Schneider Datacentre Pilot
</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

height:100vh;
background:#050b16;
color:#e5e7eb;

}


/* =====================
BOOT SCREEN
===================== */


#bootScreen{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:#000814;

color:#38bdf8;

display:flex;

justify-content:center;

align-items:center;

font-family:monospace;

z-index:9999;

}


#bootLog{

font-size:16px;

line-height:28px;

}



/* =====================
APPLICATION
===================== */


#app{

display:none;

height:100vh;

width:100%;

}



/* =====================
SIDEBAR
===================== */


.sidebar{

width:260px;

background:#0f172a;

padding:20px;

border-right:1px solid #334155;

}



.logo{

font-size:22px;

font-weight:bold;

color:#38bdf8;

margin-bottom:25px;

}



.nav-btn{

width:100%;

padding:12px;

margin-bottom:10px;

background:#111827;

color:#e5e7eb;

border:1px solid #374151;

border-radius:6px;

cursor:pointer;

}


.nav-btn:hover{

background:#1f2937;

}
