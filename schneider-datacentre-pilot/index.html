<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
SEXTANT MASTER CONSOLE - Schneider Datacentre Pilot (Simulation)
</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

height:100vh;
background:#050b16;
color:#e5e7eb;

}


/* =====================
BOOT SCREEN
===================== */


#bootScreen{

position:fixed;
top:0;
left:0;

width:100%;
height:100%;

background:#000814;

color:#38bdf8;

display:flex;
justify-content:center;
align-items:center;

font-family:monospace;

z-index:9999;

}


#bootLog{

font-size:16px;
line-height:28px;

}





/* =====================
APPLICATION
===================== */


#app{

height:100vh;

display:flex;

}





/* =====================
SIDEBAR
===================== */


.sidebar{

width:260px;

background:#0f172a;

padding:20px;

border-right:1px solid #1f2937;

}



.logo{

font-size:20px;

font-weight:bold;

color:#38bdf8;

margin-bottom:20px;

}




.nav-btn{

width:100%;

padding:12px;

margin-bottom:10px;

background:#111827;

color:#e5e7eb;

border:1px solid #374151;

border-radius:6px;

cursor:pointer;

}



.nav-btn:hover{

background:#1f2937;

}





/* =====================
MAIN AREA
===================== */


.main{

flex:1;

display:flex;

flex-direction:column;

}




.topbar{

padding:15px;

background:#0f172a;

display:flex;

justify-content:space-between;

border-bottom:1px solid #374151;

font-weight:bold;

}



.status-good{

color:#22c55e;

}


.status-warning{

color:#f59e0b;

}


.status-critical{

color:#ef4444;

}





/* =====================
MASTER CONSOLE HEADER
===================== */


.master{

padding:15px;

background:#111827;

display:flex;

justify-content:space-between;

align-items:center;

border-bottom:1px solid #374151;

}



.master h2{

color:#38bdf8;

}



.console-description{

color:#94a3b8;

margin-top:5px;

}



.warning{

color:#f59e0b;

font-size:22px;

font-weight:bold;

}



.score{

font-size:28px;

color:#38bdf8;

}





/* =====================
CONTENT PANELS
===================== */


.content{

display:flex;

gap:15px;

padding:15px;

flex:1;

}



.panel{

background:#111827;

padding:15px;

border-radius:10px;

border:1px solid #1f2937;

}



.engine{

flex:2;

}



.console{

flex:1;

height:450px;

overflow:auto;

}





/* =====================
SCENARIOS
===================== */


.scenario{

background:#1f2937;

padding:12px;

margin:10px 0;

border-radius:6px;

cursor:pointer;

}



.scenario:hover{

background:#374151;

}





/* =====================
LOG
===================== */


.log{

margin-bottom:8px;

color:#cbd5e1;

}



</style>

</head>


<body>


<!-- BOOT SCREEN -->

<div id="bootScreen">

<div id="bootLog"></div>

</div>


<!-- APPLICATION -->

<div id="app">
<script>


/* =========================
SEXTANT BOOT SEQUENCE
========================= */


const bootSteps = [

"Booting Sextant AI Kernel",

"Loading Schneider Datacentre Model",

"Checking Power Systems",

"Checking Cooling Systems",

"Loading Risk Engine",

"Activating Master Console"

];


let bootIndex = 0;



function bootSequence(){


if(bootIndex < bootSteps.length){


let line = document.createElement("div");


line.innerText =
"> " + bootSteps[bootIndex];


document
.getElementById("bootLog")
.appendChild(line);



bootIndex++;


setTimeout(
bootSequence,
500
);



}

else{


setTimeout(()=>{


document
.getElementById("bootScreen")
.style.display="none";



document
.getElementById("app")
.style.display="flex";



},800);



}


}


bootSequence();





/* =========================
RISK ENGINE
========================= */


function calculateRisk(event){


let risk = 25;



if(event.includes("Power"))

risk += 25;



if(event.includes("Cooling"))

risk += 20;



if(event.includes("Network"))

risk += 18;



if(event.includes("Load"))

risk += 15;



if(event.includes("Blackout"))

risk += 40;



return Math.min(risk,100);


}






/* =========================
SYSTEM CLASSIFICATION
========================= */


function classifyRisk(score){


if(score >= 70)

return "🔴 CRITICAL";


else if(score >= 40)

return "🟠 WARNING";


else

return "🟢 STABLE";


}







/* =========================
DECISION ENGINE
========================= */


function decisionEngine(score){


if(score >=70)

return "ACTIVATE STABILIZATION PROTOCOL";


if(score >=40)

return "PREVENTIVE RESILIENCE MODE";


return "NORMAL MONITORING";



}







/* =========================
SCENARIO EXECUTION
========================= */


function runScenario(event){


const risk =
calculateRisk(event);



const state =
classifyRisk(risk);



const decision =
decisionEngine(risk);





document
.getElementById("riskScore")
.innerText = risk;



document
.getElementById("riskState")
.innerText = state;





writeLog(
"Scenario Triggered: " + event
);



writeLog(
"Risk Score: " + risk
);



writeLog(
"System State: " + state
);



writeLog(
"AI Decision: " + decision
);



writeLog(
"Action: Evaluate mitigation pathway"
);



}








/* =========================
CONSOLE LOGGER
========================= */


function writeLog(message){


let consoleBox =
document.getElementById("console");



let line =
document.createElement("div");



line.className="log";



line.innerHTML =
"<strong>AI:</strong> "
+ message;



consoleBox.appendChild(line);



consoleBox.scrollTop =
consoleBox.scrollHeight;



}




/* =========================
SYSTEM READY CHECK
========================= */


window.addEventListener("load",()=>{


console.log(
"Sextant Master Console Online"
);


});



</script>
