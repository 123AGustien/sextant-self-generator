<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Schneider AI Datacentre Simulator</title>

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body {
    height:100vh;
    background:#0b1220;
    color:#e5e7eb;
}

#bootScreen {
    position:fixed;
    width:100%;
    height:100%;
    background:#000814;
    color:#38bdf8;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:monospace;
    z-index:9999;
}

.sidebar {
    width:260px;
    background:#0f172a;
    padding:20px;
}

.logo {
    color:#38bdf8;
    font-size:18px;
    font-weight:bold;
    margin-bottom:20px;
}

.nav-btn {
    width:100%;
    padding:10px;
    margin-bottom:10px;
    background:#111827;
    color:#e5e7eb;
    border:1px solid #374151;
}

.main {
    flex:1;
}

.topbar {
    padding:14px;
    background:#0f172a;
    display:flex;
    justify-content:space-between;
}

.status {
    color:#22c55e;
}

.content {
    display:flex;
    gap:15px;
    padding:15px;
}

.engine,
.console {

    background:#111827;
    padding:15px;
    border-radius:10px;

}

.engine {
    flex:2;
}

.console {
    flex:1;
    height:400px;
    overflow:auto;
}

.scenario {

    padding:12px;
    margin:8px;
    background:#1f2937;
    cursor:pointer;
    border-radius:6px;

}

.scenario:hover {
    background:#374151;
}

.log {
    margin-bottom:8px;
    color:#9ca3af;
}

</style>

</head>


<body>


<div id="bootScreen">
<div id="bootLog"></div>
</div>


<div id="app" style="display:none;height:100vh;display:flex;">


<div class="sidebar">

<div class="logo">
SEXTANT AI
</div>

<button class="nav-btn">
Dashboard
</button>

<button class="nav-btn">
Datacentre Engine
</button>

<button class="nav-btn">
Risk Models
</button>

</div>



<div class="main">


<div class="topbar">

Schneider Datacentre AI Simulation Console

<div id="status" class="status">
● SYSTEM ONLINE
</div>

</div>



<div class="content">


<div class="engine">

<h2>Scenario Engine</h2>

<p>Select infrastructure stress scenario:</p>


<div class="scenario"
onclick="runScenario('Power Surge')">
⚡ Power Surge Event
</div>


<div class="scenario"
onclick="runScenario('Cooling Failure')">
❄ Cooling Failure
</div>


<div class="scenario"
onclick="runScenario('Network Congestion')">
🌐 Network Congestion
</div>


<div class="scenario"
onclick="runScenario('Load Spike')">
📈 Compute Load Spike
</div>


</div>



<div class="console" id="console">

<div class="log">
System: AI Engine initialized
</div>

</div>


</div>

</div>

</div>



<script>


/* =========================
   STATUS WIRING
========================= */

window.addEventListener("load",()=>{

const status=document.getElementById("status");

if(status){
status.innerText="● SYSTEM ONLINE";
}

console.log(
"Sextant Simulation Screen v2 Wiring Loaded"
);

});



/* =========================
   RISK ENGINE
========================= */


function computeRisk(input){


const text=input.toLowerCase();


const subsystems={

power:
text.includes("power") ? 0.85 : 0.25,

cooling:
text.includes("cooling") ? 0.80 : 0.30,

network:
text.includes("network") ? 0.75 : 0.35,

load:
text.includes("load") ? 0.70 : 0.40

};


const values=Object.values(subsystems);


const risk=
values.reduce((a,b)=>a+b,0)
/ values.length;



let regime="STABLE";


if(risk>0.75)
regime="CRITICAL";

else if(risk>0.55)
regime="WARNING";


return {

risk:Number(risk.toFixed(2)),

regime:regime,

driver:Object.keys(subsystems)
.sort((a,b)=>subsystems[b]-subsystems[a])[0]

};

}



/* =========================
   SCENARIO EXECUTION
========================= */


function runScenario(name){


const consoleBox=
document.getElementById("console");



const result=
computeRisk(name);



const logs=[

`Scenario Triggered: ${name}`,

`Risk Score: ${result.risk}`,

`System State: ${result.regime}`,

`Primary Driver: ${result.driver}`,

`AI Decision: Evaluate mitigation pathway`

];



logs.forEach(text=>{

const div=document.createElement("div");

div.className="log";

div.innerHTML=text;

consoleBox.appendChild(div);

});


consoleBox.scrollTop=
consoleBox.scrollHeight;


}



const steps=[

"Booting Sextant AI Kernel",

"Loading Datacentre Models",

"Initializing Risk Engine",

"Checking Infrastructure",

"AI CORE ONLINE"

];


let step=0;


function boot(){

if(step<steps.length){

let line=document.createElement("div");

line.textContent="> "+steps[step];

document.getElementById("bootLog")
.appendChild(line);


step++;

setTimeout(boot,500);


}else{


setTimeout(()=>{

document.getElementById("bootScreen")
.style.display="none";


document.getElementById("app")
.style.display="flex";


},700);


}

}


boot();


</script>


</body>
</html>
